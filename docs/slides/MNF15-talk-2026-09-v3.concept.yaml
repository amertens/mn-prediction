- title: How does the model work, and how was it tested?
  layout: pipeline
  banner: "Tested by hiding one district in five, then a whole region, then a whole country. Scored by how often it puts the worse of two districts first: a coin toss gets half"
  banner_size: 15
  banner_height: 0.85
  heading_size: 17
  caption_size: 14.5
  items:
  - icon: vials
    heading: Four national surveys
    caption: "206 districts where blood was drawn, in The Gambia, Ghana, Sierra Leone and Malawi"
  - icon: satellite
    heading: 575 public layers
    caption: "Climate, soil, crops and livestock, disease, food prices, household surveys: every district, 28 sources, none bought"
  - icon: layer-group
    heading: Domain-PC index
    caption: "Principal components of each family of layers, weighted by how strongly each tracks deficiency. Nothing tuned"
  - icon: ranking-star
    heading: Every district ranked
    caption: "Including the districts no survey reached, and countries with no survey at all"

- title: How can it help plan the next survey?
  layout: icon_rows
  heading_size: 18
  text_size: 14
  image: {file: ../../results/figures/mnf15_v3/v3_ceiling_by_nutrient.png, width: 4.3}
  items:
  - icon: ruler
    heading: How close can any model get?
    caption: "Most districts rest on one community of about 12 children, so even a perfect model could only agree up to the grey bars. Ours reaches 0.4 to 0.6."
  - icon: vial
    heading: Alongside a survey, a small national sample
    caption: "About 40 blood draws per nutrient anchor the ranking; district figures then typically land within about 10 points."
  - icon: map-location-dot
    heading: Check the model's shortlist first
    caption: "It says which unsurveyed districts to visit first. The dashboard's planning tab lets you try a design."

- title: What can it be used for, and what not?
  layout: cards
  area_width: 9.7
  heading_size: 18
  text_size: 14.5
  icon_size: 0.7
  items:
  - icon: check@green
    heading: Use it to
    lines:
    - Rank districts to reach first
    - Sequence a programme roll-out
    - Find districts where deficiency stays high despite fortification
    - Choose which unsurveyed districts to check first
  - icon: triangle-exclamation@amber
    heading: Use with survey data
    lines:
    - "% deficient in a district: roughly. Usually within 10 points, sometimes 30 off"
    - "Reaching the most people: multiply by population"
  - icon: xmark@grey
    heading: Do not use it to
    lines:
    - Replace a survey
    - Judge whether a programme worked
    - Explain why a district is deficient
  images:
  - {file: img/qr_dashboard.png, x: 10.95, y: 2.1, w: 1.9, caption: "Every district, five countries:\namertens.shinyapps.io/\nmicronutrient-burden", caption_size: 11, caption_width: 2.25, caption_height: 1.1}

- title: Conclusions and next steps
  layout: two_panel
  area_width: 9.7
  heading_size: 15
  text_size: 12.5
  banner: Modelling extends a survey's reach. It does not replace the survey.
  banner_size: 19
  panels:
  - icon: magnifying-glass-chart
    title: What we found
    items:
    - icon: satellite
      heading: Free public data carry real signal
      caption: Much of it in climate and soil, measured everywhere, every year.
    - icon: ranking-star
      heading: Better than regional averages in a surveyed country
      caption: With no survey at all, about as good as a survey's own regional averages.
    - icon: layer-group
      heading: The limit today is surveys, not data
      caption: On average, each added survey improved the ranking for countries held out.
  - icon: handshake
    title: What we ask
    items:
    - icon: vials
      heading: Share your survey with the pool
      caption: Recent, planned, or sitting in a drawer.
    - icon: map-location-dot
      heading: Design the next survey with us
      caption: Where to sample, and how many communities in a district.
    - icon: circle-question
      heading: Tell us what is good enough
      caption: How accurate must a district ranking be before you would use it?
  images:
  - {file: img/qr_dashboard.png, x: 10.95, y: 2.3, w: 1.9, caption: "Try it:\namertens.shinyapps.io/\nmicronutrient-burden", caption_size: 11, caption_width: 2.25, caption_height: 0.9}

# ---- appendix: v1's two illustrated slides, unchanged in content
- title: Where the predictors come from
  layout: grid
  columns: 2
  footnote: "575 district-level predictors from 28 public sources, linked to 554 districts in four countries. Number of predictors in brackets; every layer is public."
  groups:
  - icon: satellite
    title: Climate, satellite imagery, greenness
    count_of: [Satellite embedding, Climate and weather, Ecosystem productivity/greenness, Water and coast proximity]
    caption: "TerraClimate rainfall and temperature; MODIS greenness; AlphaEarth satellite embedding; distance to water and coast"
  - icon: mound
    title: Soil chemistry
    count_of: [Soil characteristics]
    caption: "SoilGrids and iSDA: pH, organic carbon, texture, nutrient availability"
  - icon: tractor
    title: Crops and livestock
    count_of: ["Agricultural production, land use", Livestock density]
    caption: "MapSPAM crop mix and cropland; cattle, goat and poultry density (Gridded Livestock of the World)"
  - icon: basket-shopping
    title: Food prices, diet, fortification
    count_of: [Food prices and supply, Market prices (RTFP), Household diet and consumption (HCES), "Dietary inadequacy (MODELLED SURFACE, HCES)", Food fortification and supplementation]
    caption: "WFP and World Bank prices; household budget surveys; GFDx fortification coverage"
  - icon: virus
    title: Infectious disease and immunisation
    count_of: [Infection and inflammation burden, Malaria incidence and treatment, Helminth burden and control, Infant and child morbidity/mortality, Child mortality, Adult and maternal mortality, Immunisation]
    caption: "Malaria Atlas; WHO ESPEN helminths; IHME child morbidity and mortality; immunisation coverage"
  - icon: child
    title: Nutrition status and infant feeding
    count_of: [Child anthropometry, Adult nutrition, Nutrition status (MODELLED SURFACE), Anaemia and haemoglobin, Infant and young child feeding]
    caption: "Stunting and wasting; anaemia (modelled); infant and young child feeding (IHME, MICS, DHS)"
  - icon: house-chimney
    title: Households, schooling, water, health access
    count_of: [Household assets and characteristics, "Education, employment, SES", Water and sanitation, "Fertility, reproductive health", Healthcare access]
    caption: "Assets, schooling, employment; water and sanitation; fertility; access to care (MICS, DHS)"
  - icon: city
    title: Settlement, population, conflict
    count_of: [Built environment, "Ruralness, population density, built environment", Conflict and insecurity]
    caption: "Night lights, population density, built-up area (WorldPop, GHSL); ACLED conflict events"

- title: How the model is built and tested, step by step
  layout: two_panel
  heading_size: 15
  text_size: 12
  panels:
  - icon: sliders
    title: How the model is built
    items:
    - icon: arrow-down-wide-short
      heading: Every layer becomes a within-country rank
      caption: A level difference between surveys cannot act as signal.
    - icon: layer-group
      heading: Each family of layers is reduced to principal components
      caption: Learned from the predictors only, never from the outcome.
    - icon: scale-balanced
      heading: Each component is weighted by how well it tracked deficiency
      caption: In the training districts, where blood was drawn.
    - icon: lock
      heading: The weighted sum, rescaled to the training districts' spread
      caption: Nothing is tuned.
  - icon: clipboard-check
    title: How it is tested
    items:
    - icon: location-crosshairs
      heading: One district in five is hidden
      caption: Compared against the region's average, computed without that district.
    - icon: draw-polygon
      heading: A whole region is hidden
      caption: Compared against a map of the neighbouring districts.
    - icon: earth-africa
      heading: A whole country is hidden
      caption: Compared against chance, with countries kept whole.
