# Illustrated concept slides of MN-proxy-full-talk-2026-09.qmd, drawn IN PLACE on the
# rendered deck by scripts/render_deck.sh ... --concept <this file>. Each entry is matched
# to the rendered slide with the same title (the qmd keeps that slide as title + notes).
# Text may use {name} placeholders from the deck's quantities JSON, written from the qmd's
# setup chunk: {x:.2f}, {x:.0f}, {x:pc} (percent), {x:sgn} (signed). Icons are Font
# Awesome 6 names, optionally "name@colour" (blue, light, green, amber, grey, white).
deck: MN-proxy-full-talk-2026-09.qmd
fill_figures: true   # enlarge every lone figure to the content area
slides:

- title: title slide
  layout: title
  logos:
  - {file: img/logo_ucberkeley.png, width: 2.4}
  - {file: img/logo_ucdavis.png, width: 2.4}
  - {file: img/logo_mnforum.png, width: 2.0}
  acknowledgement: We are grateful for the funding support of the Gates Foundation.

- title: Goals
  layout: icon_rows
  image: {file: img/goals_ghana_map.png, width: 2.2}
  items:
  - icon: map-location-dot
    heading: Estimate deficiency prevalence, nationally and by district
    caption: From a wide range of proxy indicators, validated against the prevalence measured by biomarker assessment in national surveys.
  - icon: ranking-star
    heading: Identify the subnational regions at greatest risk
    caption: A ranking a program can act on, and a level once anchored to a national number.
  - icon: handshake
    heading: Engage national stakeholders throughout
    caption: Ghana as the worked example; the dashboard and country briefs as the shared product.

- title: "Surveys are rare; the proxies are everywhere"
  layout: icon_rows
  image: {file: img/old_s02_intro_photo_1.png, width: 4.3}
  items:
  - icon: vial
    heading: Biomarker surveys are rare and costly
    caption: About one national survey per country and decade; programs need district estimates between them.
  - icon: layer-group
    heading: "{n_pred} district-level proxies"
    caption: Open gridded layers and public survey microdata, linked to four national biomarker surveys.
  - icon: bullseye
    heading: Predict deficiency by district
    caption: Iron, vitamin A, folate, B12 and zinc, in surveyed and unsurveyed districts.

- title: "Both a big-data opportunity and a small-data problem"
  layout: two_panel
  heading_size: 16
  text_size: 12.5
  panels:
  - icon: database
    title: "Big data: the predictors"
    items:
    - heading: "{n_pred} columns from {n_src} sources"
      caption: "Rasters at 30 m to 10 km summarized over {n_spine} districts; a 64-dimension satellite embedding; four household surveys aggregated from microdata."
    - heading: "Reduced to {n_dom} domains"
      caption: Leading principal components per domain, learned on training districts only; nothing chosen on the outcome.
    - heading: All of it public
      caption: The headline set has no DHS in it; a country without a recent DHS can rebuild it.
  - icon: vial
    title: "Small data: the outcome"
    items:
    - heading: One biomarker survey per country per decade
      caption: "Four surveys, {n_cells} country-outcome cells, {n_districts} surveyed districts in all."
    - heading: 14 to 87 districts per country
      caption: The effective sample size of every model; a tuned estimator shrinks to the constant, so the index tunes nothing.
    - heading: Honest folds and a reliability ceiling
      caption: Folds cut by district, region and country; the survey's own district noise sets the ceiling any model can reach.

- title: "Which deficiencies do we predict?"
  layout: cards
  heading_size: 18
  text_size: 13
  icon_size: 0.75
  items:
  - icon: droplet
    heading: Iron
    lines:
    - "Who: children under five; non-pregnant women"
    - "Where: all four countries"
    - "Biomarker: ferritin, adjusted for inflammation"
    - "Cut-off: ferritin below 12 (children) or 15 (women) ug/L"
  - icon: carrot
    heading: Vitamin A
    lines:
    - "Who: children under five; non-pregnant women"
    - "Where: all four countries"
    - "Biomarker: retinol-binding protein, adjusted for inflammation"
    - "Cut-off: RBP below 0.70 umol/L"
  - icon: leaf
    heading: Folate
    lines:
    - "Who: non-pregnant women"
    - "Where: Ghana, Sierra Leone, Malawi"
    - "Biomarker: serum folate"
    - "Cut-off: below 10 nmol/L"
  - icon: drumstick-bite
    heading: B12
    lines:
    - "Who: non-pregnant women"
    - "Where: Ghana, Sierra Leone, Malawi"
    - "Biomarker: serum B12"
    - "Cut-off: below 150 pmol/L"
  - icon: wheat-awn
    heading: Zinc
    lines:
    - "Who: children under five; non-pregnant women"
    - "Where: Malawi only"
    - "Biomarker: serum zinc"
    - "Cut-off: IZiNCG thresholds"

- title: What do the land, climate and agriculture layers look like?
  layout: icon_rows
  heading_size: 16
  text_size: 12
  image: {file: img/ghana_sources_land.png, width: 4.0}
  items:
  - icon: cloud-sun-rain
    heading: Climate
    caption: Monthly rainfall and temperature at the survey year and as 30-year normals; drought and evaporation (TerraClimate, MODIS).
  - icon: mound
    heading: Soil
    caption: pH, organic carbon, texture and nutrients such as zinc and iron, at two depths (SoilGrids, iSDA).
  - icon: tractor
    heading: Crops and livestock
    caption: What is grown and how much, cattle, goats, sheep, pigs and poultry per square kilometer (MapSPAM, Gridded Livestock).
  - icon: satellite
    heading: Land cover and satellite embedding
    caption: Cropland, grassland, built-up area, night lights, plant productivity, and a 64-number summary of a year of satellite images (AlphaEarth).
  - icon: water
    heading: Water and terrain
    caption: Distance to permanent water and the coast; elevation and slope.

- title: What do the health, food and household layers look like?
  layout: icon_rows
  heading_size: 16
  text_size: 12
  image: {file: img/ghana_sources_health.png, width: 4.0}
  items:
  - icon: virus
    heading: Modeled health surfaces
    caption: "Malaria, anemia, child growth, diarrhea, sanitation and vaccination, mapped at 5 km by IHME and the Malaria Atlas; helminths from WHO."
  - icon: basket-shopping
    heading: Food prices and supply
    caption: Local staple prices against the national level (WFP, World Bank), food security phases, fortification standards.
  - icon: people-roof
    heading: Public household surveys
    caption: "MICS and the national budget surveys, aggregated to districts: wealth, schooling, water, infant feeding, what households ate last week."
  - icon: users
    heading: People and access
    caption: Population and density, travel time to health care and markets, a relative wealth index from satellite and phone data.
  - icon: lock
    heading: What is kept out
    caption: The DHS aggregates exist for all four countries and are used only as a check; the headline models use open and public data alone.

- title: How are the layers matched to districts in space and time?
  layout: icon_rows
  items:
  - icon: map
    heading: "Space: one list of {n_spine:.0f} districts"
    caption: Every layer is joined to it by a district code, never by a district's name, so a renamed or split district cannot silently drop out.
  - icon: calendar-check
    heading: "Time: every layer at the survey year, or the nearest"
    caption: Climate enters as a 30-year normal plus the survey year's anomaly; household surveys as the round nearest the biomarker survey.
  - icon: file-lines
    heading: The gap is recorded for every column
    caption: "{n_exact:.0f} columns sit exactly on the survey year in every country, {n_static:.0f} are static layers; where a source is years off, the gap travels with the column."

- title: "{n_dom:.0f} conceptual domains of proxy variables"
  layout: grid
  columns: 2
  footnote: "Grouped into eight for the slide; number of predictors in brackets. The {n_dom:.0f} domains: satellite embedding; climate and weather; soil; ecosystem productivity; water and coast proximity; agricultural production and land use; livestock density; food prices and supply; market prices; household diet (HCES); dietary inadequacy; fortification and supplementation; infection and inflammation; malaria; helminths; infant and child morbidity and mortality; child mortality; adult and maternal mortality; immunization; child anthropometry; adult nutrition; nutrition status surfaces; anemia and hemoglobin; infant and young child feeding; household assets; education, employment and SES; water and sanitation; fertility and reproductive health; healthcare access; built environment; ruralness and population density; conflict."
  groups:
  - icon: satellite
    title: Environment from satellite
    count_of: [Satellite embedding, Climate and weather, Ecosystem productivity/greenness, Water and coast proximity]
    caption: AlphaEarth embedding; temperature, rainfall, drought index; NDVI and productivity; distance to water and coast
  - icon: mound
    title: Soil
    count_of: [Soil characteristics]
    caption: "SoilGrids and iSDA: pH, organic carbon, texture, nutrient availability"
  - icon: tractor
    title: Agriculture and livestock
    count_of: ["Agricultural production, land use", Livestock density]
    caption: MapSPAM crop mix and cropland; cattle, goat and poultry density
  - icon: basket-shopping
    title: Food, prices and diet
    count_of: [Food prices and supply, Market prices (RTFP), Household diet and consumption (HCES), "Dietary inadequacy (MODELLED SURFACE, HCES)", Food fortification and supplementation]
    caption: WFP and World Bank prices; budget-survey diets; fortification and supplementation coverage
  - icon: virus
    title: Infection and disease
    count_of: [Infection and inflammation burden, Malaria incidence and treatment, Helminth burden and control, Infant and child morbidity/mortality, Child mortality, Adult and maternal mortality, Immunisation]
    caption: Malaria, helminths, inflammation; child morbidity and mortality; immunisation coverage
  - icon: child
    title: Nutrition status
    count_of: [Child anthropometry, Adult nutrition, Nutrition status (MODELLED SURFACE), Anaemia and haemoglobin, Infant and young child feeding]
    caption: Stunting and wasting; anemia surfaces; infant and young child feeding
  - icon: house-chimney
    title: Households and economy
    count_of: [Household assets and characteristics, "Education, employment, SES", Water and sanitation, "Fertility, reproductive health", Healthcare access]
    caption: Assets, schooling, employment; water and sanitation; fertility; access to care
  - icon: city
    title: Settlement, access and security
    count_of: [Built environment, "Ruralness, population density, built environment", Conflict and insecurity]
    caption: Night lights, population density, travel time, built-up area; conflict events

- title: "How is the district table built?"
  layout: pipeline
  items:
  - icon: vials
    heading: Clean and merge the surveys
    caption: Four surveys, one definition per nutrient.
  - icon: satellite
    heading: Link gridded layers
    caption: Each layer averaged over each district.
  - icon: people-roof
    heading: Aggregate household surveys
    caption: MICS and budget-survey microdata averaged to districts.
  - icon: calendar-check
    heading: Align in time
    caption: Every layer at the survey year or the nearest year available.
  - icon: lock-open
    heading: Open data only
    caption: Headline models use open layers and public microdata.
  - icon: sliders
    heading: Rank-normalize and reduce
    caption: Rank within country; each of the {n_dom} domains to its leading components. Nothing chosen on the outcome.

- title: "Which algorithms did we compare?"
  layout: two_panel
  panels:
  - icon: book-open
    title: The candidate library
    items:
    - icon: minus
      heading: Simple mean and penalized regressions
      caption: The floor, and the elastic net on domain components or on all columns.
    - icon: tree
      heading: Random forest, gradient boosting, additive trees
      caption: Flexible learners that can find interactions.
    - icon: map-location-dot
      heading: Spatial smoother and geostatistical model
      caption: Neighbors only, or a spatial field plus covariates (the DHS Program's method).
    - icon: scale-balanced
      heading: Principal-component index
      caption: Domain components weighted by their training-fold rank correlation; nothing tuned.
  - icon: check-double
    title: How they were compared, and who won
    items:
    - icon: shuffle
      heading: Same honest folds for every algorithm
      caption: Cut by district, region and country; no district split between training and test.
    - icon: trophy
      heading: "The index wins: {sl_index:.2f} against {sl_rank:.2f} for the ensemble"
      caption: "Random forest {sl_rf:.2f}; the smoother ties inside a country and cannot cross a border."
    - icon: circle-info
      heading: Why the simplest wins
      caption: With 14 to 87 districts, every algorithm that tunes a parameter shrinks toward the constant; the index has none.
- title: "How do we choose among algorithms?"
  layout: icon_rows
  image: {file: img/ensemble_vfold.png, width: 2.4}
  items:
  - icon: people-group
    heading: A competition of algorithms
    caption: Simple regressions and more complex machine learning models side by side, to allow interactions and nonlinear associations.
  - icon: trophy
    heading: The best team wins
    caption: "A weighted combination of algorithms; the weights come from performance on data the algorithms did not see."
  - icon: shuffle
    heading: V-fold cross-validation
    caption: Internal data splits by district, so that no district is in both training and validation; guards against overfitting.
  - icon: book-open
    heading: The library
    caption: "Simple mean, penalized regressions, random forest, gradient boosting, additive trees, geostatistical models, and the principal-component index that wins."

- title: "How does the best-performing model work?"
  layout: pipeline
  items:
  - icon: arrow-down-wide-short
    heading: Rank-normalize within country
    caption: Every predictor becomes a within-country rank, so a level offset between surveys cannot act as signal.
  - icon: layer-group
    heading: Domain components
    caption: "Leading principal components of each of the {n_dom} domains, to 80% of variance, learned on the training districts only."
  - icon: scale-balanced
    heading: Weight by rank correlation
    caption: Each component is weighted by its Spearman correlation with the outcome in the training fold; sign and size, nothing else is fitted.
  - icon: plus
    heading: Sum and rescale
    caption: The weighted sum, rescaled to the training outcome's spread; the infinite-penalty limit of a ridge regression on the components.

- title: "Three levels of prediction"
  layout: cards
  items:
  - icon: map-location-dot
    heading: District in-fill
    lines:
    - "Question: a district the survey missed, in a country it visited"
    - "Folds: 5-fold by district, 10 draws"
    - "Compared with: the region's average (without that district); a spatial smoother"
  - icon: draw-polygon
    heading: Region extrapolation
    lines:
    - "Question: a whole unsurveyed region"
    - "Folds: leave-one-region-out"
    - "Compared with: a spatial smoother"
  - icon: earth-africa
    heading: Cross-country transport
    lines:
    - "Question: a country with no biomarker survey"
    - "Folds: leave-one-country-out"
    - "Compared with: chance (permutation with countries kept whole)"

- title: "The strongest outcome-country combinations"
  layout: cards
  heading_size: 17
  text_size: 13
  icon_size: 0.75
  items:
  - icon: ranking-star
    heading: "{best1_label}"
    lines:
    - "Ranking, held out: {best1_rho:.2f} (prevalence target {best1_rho_prev:.2f})"
    - "District prevalence error: {best1_wmae:.1f} points (the region's average does as well)"
    - "National prevalence: {best1_prev:pc}"
  - icon: ranking-star
    heading: "{best2_label}"
    lines:
    - "Ranking, held out: {best2_rho:.2f} (prevalence target {best2_rho_prev:.2f})"
    - "District prevalence error: {best2_wmae:.1f} points"
    - "National prevalence: {best2_prev:pc}"
  - icon: ranking-star
    heading: "{best3_label}"
    lines:
    - "Ranking, held out: {best3_rho:.2f} (prevalence target {best3_rho_prev:.2f})"
    - "District prevalence error: {best3_wmae:.1f} points"
    - "National prevalence: {best3_prev:pc}"
  - icon: ranking-star
    heading: "{best4_label}"
    lines:
    - "Ranking, held out: {best4_rho:.2f} (prevalence target {best4_rho_prev:.2f})"
    - "District prevalence error: {best4_wmae:.1f} points"
    - "National prevalence: {best4_prev:pc}"

- title: "How should every map in this deck be read?"
  layout: cards
  items:
  - icon: circle-check
    heading: "Grade A: several clusters"
    lines:
    - "What: surveyed districts with more than one survey cluster ({multi_n:.0f} districts)"
    - "On the map: solid fill"
    - "Read: the survey's own district value is worth comparing with"
  - icon: circle-half-stroke
    heading: "Grade B: one cluster"
    lines:
    - "What: surveyed districts with a single cluster ({single_share:pc} of surveyed districts)"
    - "On the map: hatched"
    - "Read: the survey's district value is itself a noisy estimate; the ceiling slide says how noisy"
  - icon: circle-question
    heading: "Grade C: no survey"
    lines:
    - "What: districts the survey never reached, and every district of a country with no survey"
    - "On the map: gray on survey maps, filled on model maps"
    - "Read: only the model speaks; its intervals say how stable it is, not how right"

# ---- four candidate translations of the accuracy numbers for a policy audience (pick one or two) ----
- title: "What does a rank correlation of {infill_index:.2f} mean on the ground?"
  layout: icon_rows
  items:
  - icon: right-left
    heading: "Take any two districts: the best model orders them the way the survey does {pairs_pct:pc} of the time"
    caption: "Counted over every pair of districts. A random ordering gets 50% on average, the survey's own regional averages {pairs_jk:pc}; in a country the model has never seen, {pairs_pct_tr:pc}."
  - icon: flag
    heading: "In the fifth of districts it flags, deficiency runs at {top20_prev_index:.0f}% against {top20_prev_nat:.0f}% nationally"
    caption: "A map that knew every district would find {top20_prev_oracle:.0f}% in its worst fifth."
  - icon: people-group
    heading: "That fifth holds {cap_index:pc} of the deficient people"
    caption: "The survey's own regional averages capture {cap_jk:pc}; a perfect map {cap_oracle:pc}. Real, modest, and better than today's number."

- title: "How much of what a survey can see does the model recover?"
  layout: icon_rows
  items:
  - icon: wave-square
    heading: "The survey itself is noisy at district level: a perfect predictor would score only {vc_honest:.2f}"
    caption: "Known from a variance model of respondents within clusters within districts: it says how much of the district-to-district variation is real."
  - icon: gauge-high
    heading: "The model reaches {ceiling_share:pc} of that ceiling"
    caption: "{infill_index_p:.2f} on the prevalence target against a ceiling of {vc_honest:.2f}. The gap is mostly the survey's noise, not the model's ignorance."
  - icon: building-columns
    heading: "And beats the best prediction you can make from survey data alone"
    caption: "The region's average, computed without the district itself: {infill_jk:.2f}; the model {infill_index:.2f}, better in {infill_beats_jk:.0f} of {infill_paired:.0f} outcome-country combinations."

- title: "Does the model put districts in the right severity band?"
  layout: cards
  items:
  - icon: bullseye
    heading: Exact WHO band
    lines:
    - "Model: {rc_ex:pc} of districts"
    - "Regional averages: {rc_jk_ex:pc}"
    - "Bands: under 2%, 2 to 10, 10 to 20, 20% or more (vitamin A); each district held out"
  - icon: circle-half-stroke
    heading: Within one band
    lines:
    - "Model: {rc_w1:pc} of districts"
    - "Regional averages: {rc_jk_w1:pc}"
    - "A district the survey calls severe is placed severe or moderate"
  - icon: triangle-exclamation
    heading: Two or more bands wrong
    lines:
    - "Model: {rc_far:pc} of districts"
    - "Regional averages: {rc_jk_far:pc}"
    - "The error a severity map cannot afford; in a new country the level comes from the national anchor"

- title: "Which decisions are our models good enough for?"
  layout: checklist
  items:
  - status: "yes"
    heading: Which districts to visit, assess or enrol first
    caption: "Needs an order, not a number: {pairs_pct:pc} of district pairs ordered as the survey does, against {pairs_jk:pc} for the regional average."
  - status: "yes"
    heading: Where the next survey puts its clusters
    caption: The ranking is the input to the anchor-and-rank design.
  - status: "yes"
    heading: Sequencing a program roll-out across districts
    caption: Same reason; the order is what the roll-out needs.
  - status: partly
    heading: A planning prevalence for a district
    caption: "Only with a national anchor: {ar_a1:.1f} points median error at a 5% national sample."
  - status: "no"
    heading: A district prevalence with no survey at all, or whether a program worked
    caption: The model has no level of its own and is validated on one point in time, not on change.

- title: What drives the transport models?
  layout: icon_rows
  items:
  - icon: mountain-sun
    heading: The landscape gradient
    caption: "Grassland and cropland cover, the share of ruminants in the herd (top twenty in {rec_ruminant:.0f} of {loco_fits:.0f} held-out fits), cattle and sheep density, cereal-heavy cropping, low plant productivity: dry, grassy, pastoral, unproductive districts rank worse on every outcome."
  - icon: child-reaching
    heading: The modeled child-growth and anemia surfaces
    caption: Wasting, underweight and anemia point to worse status; overweight points the other way and behaves as a wealth proxy.
  - icon: basket-shopping
    heading: The food economy
    caption: "The local staple price relative to the national level appears in {rec_staple:.0f} fits across {rec_staple_outcomes:.0f} outcomes."
  - icon: road
    heading: Remoteness and demography
    caption: Distance to the coast and the dependency ratio, in about a third of the fits.
  - icon: mosquito
    heading: Malaria intensity, with an unexpected sign
    caption: High-malaria zones are the wetter, more productive ones. Single household-survey items rarely recur.

- title: The dashboard
  layout: icon_rows
  heading_size: 15
  text_size: 11.5
  image: {file: img/dashboard_map.png, width: 6.0}
  items:
  - icon: link
    heading: amertens.shinyapps.io/micronutrient-burden
    caption: Every number in this talk, for every district; one estimator behind every tab.
  - icon: map-location-dot
    heading: Where is deficiency?
    caption: A priority score for every district, how sure the model is, a planning prevalence; click a district for what drives it.
  - icon: magnifying-glass-chart
    heading: What drives it? Can we trust it?
    caption: "Leading predictors, what travels across borders, the catalog of {n_pred} predictors; the three tests and the ceiling."
  - icon: clipboard-check
    heading: Plan a survey
    caption: The anchor-and-rank design; a printable brief per country.

- title: What the models can and cannot do yet
  layout: checklist
  items:
  - status: "yes"
    heading: Rank districts in a surveyed country?
    caption: "Yes: {infill_index:.2f}, null {null_d:.2f}."
  - status: partly
    heading: Rank districts in a new country?
    caption: "Yes, less well: {tr_index:.2f} against {null_d:.2f}."
  - status: "yes"
    heading: Which predictors carry the signal?
    caption: Satellite, climate and soil.
  - status: "no"
    heading: Prevalence in a new country from the model alone?
    caption: Not yet.
  - status: "yes"
    heading: Prevalence with one national anchor?
    caption: "Yes: {ar_a1:.1f} points at a 5% sample."
  - status: "no"
    heading: Replace biomarker surveys?
    caption: "No: the ceiling is the survey's."
  - status: partly
    heading: Guide where the next survey samples?
    caption: In design, not piloted.
  - status: partly
    heading: Say how sure each map is?
    caption: "Stable, yes; verified, no: coverage {cov_mean:pc}, not 90%; a calibrated 90% interval is \u00b1{cal90:pc} of the list. A worst-third call is right {hit3:pc} of the time (chance {hit3_base:pc})."

- title: What have we learned, and what comes next?
  layout: icon_rows
  heading_size: 16
  text_size: 12
  items:
  - icon: map-location-dot
    heading: "Public data can rank a country's districts by deficiency"
    caption: "Inside a surveyed country better than the survey's own regional averages ({infill_index:.2f} vs {infill_jk:.2f}); six district pairs in ten in the survey's order."
  - icon: earth-africa
    heading: "And in a country with no survey, where nothing else can"
    caption: "Rankings carry across borders ({cs_d:.2f} from climate and soil); Cote d'Ivoire has its map. Levels need one national number."
  - icon: layer-group
    heading: "Where the survey can see districts, the model is close to the best any model could be"
    caption: "Six outcome-country combinations at 0.64; The Gambia, with several clusters per district, {gambia_min:.2f} to {gambia_max:.2f}."
  - icon: shield-halved
    heading: "The uncertainty on every map is honest about what it is"
    caption: "Stable under resampling, not verified: a worst-third call is right {hit3:pc} of the time, chance {hit3_base:pc}."
  - icon: flag-checkered
    heading: "Next: the fifth survey scores two pre-registered indices; the survey design gets piloted"
    caption: "Every survey added improves every other country's map ({tc_n1:.2f} with one training survey, {tc_n3:.2f} with three)."
